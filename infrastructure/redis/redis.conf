# Redis configuration for Heroku deployment

# Memory management
maxmemory 256mb
maxmemory-policy allkeys-lru

# Persistence settings
save 900 1
save 300 10
save 60 10000

# Append-only file for durability
appendonly yes
appendfsync everysec

# Network settings (will be overridden by startup script)
bind 0.0.0.0
port 6379

# Logging
loglevel notice

# Security (disabled for simplicity - enable in production)
# requirepass your-strong-password

# Performance tuning for Heroku
tcp-keepalive 60
timeout 300
