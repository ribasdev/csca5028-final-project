[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisor/supervisord.pid

[program:opensearch]
command=/usr/share/opensearch/bin/opensearch
user=opensearch
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/opensearch.err.log
stdout_logfile=/var/log/supervisor/opensearch.out.log
environment=OPENSEARCH_JAVA_OPTS="-Xms256m -Xmx256m"

[program:redis]
command=redis-server /etc/redis/redis.conf
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/redis.err.log
stdout_logfile=/var/log/supervisor/redis.out.log

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/nginx.err.log
stdout_logfile=/var/log/supervisor/nginx.out.log
